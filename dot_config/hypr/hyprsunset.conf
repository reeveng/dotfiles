# Night light, on a clock. hyprsunset holds each profile until the next one,
# so the last of the evening carries through the small hours to the dawn ramp.
#
# The steps are close enough together to read as one continuous slide rather
# than a series of jumps, and they are spaced evenly in mireds, not kelvin,
# because kelvin is not perceptually even.
#
# Anchors: dusk falls 19:30 to 21:30, 6500K down to 3000K, and dawn climbs
# back over the half hour before 07:00. Change those and the steps between
# them have to be recomputed.
#
# Nothing starts hyprsunset on its own; hypr/autostart.lua does.

