# Makes hyprsunset do nothing to the screen by default
# Without this, the default applies some tint to the monitor
profile {
    time = 07:00
    identity = true
}

# Enable auto switch to nightlight:
profile {
    time = 19:30
    temperature = 1000
}
profile {
    time = 19:45
    temperature = 2000
}
profile {
    time = 20:00
    temperature = 3000
}
profile {
    time = 20:30
    temperature = 4000
}
profile {
    time = 21:00
    temperature = 5000
}
