# Night light, on a clock. hyprsunset holds each profile until the next one,
# so the last of the evening carries through the small hours to 07:00.
#
# Nothing starts hyprsunset on its own; hypr/autostart.lua does.

# Daylight. Identity leaves the monitor alone, where the built-in default
# would put a tint on it.
profile {
    time = 07:00
    identity = true
}

# Dusk, warming toward bedtime.
profile {
    time = 19:30
    temperature = 5500
}
profile {
    time = 20:00
    temperature = 4500
}
profile {
    time = 20:30
    temperature = 4000
}
profile {
    time = 21:00
    temperature = 3500
}
profile {
    time = 21:30
    temperature = 3000
}
